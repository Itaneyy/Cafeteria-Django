<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>{% block titulo%}{%endblock%}</title>
  </head>
  <body>
    <header class="container  px-0" style="width: 86%;">
    <nav class="navbar d-flex px-0">
        <div class="d-flex">
            <img src="../static/img/asa(3).jpg"
                 alt="logo"
                 height="100">
        </div>

        <div class="ms-auto d-flex gap-3 me-3 ">
            <a href="#" class="nav-link btn" title="Cart">
            <i class="bi bi-cart4" style="color: black; font-size: 22px"></i>
          </a>
          <a href="#" class="nav-link btn" title="News">
            <i class="bi bi-bell" style="color: black; font-size: 22px"></i>
          </a>

          <form class="d-flex" role="search" target="" method="">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
             
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
    </nav>
</header>
<hr class="my-auto">

    
    <main>{%block conteudo%}{%endblock%}</main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
