<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
/>

    <title>Menu</title>
  </head>
  <body>
    
    <div class="container my-5">
      <h2 class="mb-4">Our coffee menu</h2>

      <div class="row">
        {% for cafe in cafes %}
        <div class="col-md-4 mb-4">
          <div class="card h-100 shadow-sm">
            <img
              src="{{ cafe.image }}"
              class="card-img-top"
              alt="{{ cafe.title }}"
              style="height: 200px; object-fit: cover"
            />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ cafe.title }}</h5>
              <p class="card-text text-muted small">{{ cafe.description }}</p>

              <div class="mt-auto">
                <h4 class="text-success fw-bold">R$ {{ cafe.price }}</h4>
                <a href="#" class="btn btn-primary w-100"
                  >
                  <i class="bi bi-cart4" ></i>
                  Add to Cart</a
                >
              </div>
            </div>
          </div>
        </div>
        {% empty %}
        <p class="text-center">No coffee found at the moment.</p>
        {% endfor %}
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
