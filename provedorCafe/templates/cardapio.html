{%extends 'base.html'%} {%block titulo%} Menu {%endblock%}
{%block conteudo%}
<div class="container my-0">
  <h2 class=" display-4 mb-4">Our menu</h2>
  
  <div class="row">
    {% for cafe in cafes %}
    <div class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        <img
          src="{{ cafe.image }}"
          class="card-img-top"
          alt="{{ cafe.title }}"
          style="height: 200px; object-fit: cover"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ cafe.title }}</h5>
          <p class="card-text text-muted small">{{ cafe.description }}</p>

          <div class="mt-auto">
            <h4 class="text-success fw-bold">
              R$ {{ cafe.price|floatformat:2}}
            </h4>
            <a href="#" class="btn btn-primary w-100">
              <i class="bi bi-cart4"></i>
              Add to Cart</a
            >
          </div>
        </div>
      </div>
    </div>
    {% empty %}
    <p class="text-center">No coffee found at the moment.</p>
    {% endfor %}
  </div>
</div>

{%endblock%}
